name: conformance-gate
on: [pull_request]
jobs:
  rfc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: '1.25' }
      - run: go test -run=Conformance -count=1 -v ./... | tee rfc.txt
      - run: ./scripts/rfc-coverage-gate.sh rfc.txt

      # Every span a comment presents as an RFC quotation must be verbatim in the
      # RFC. Five altered or invented quotations shipped into this repo before
      # this ran; one cited a sentence that is not in the document at all.
      #
      # The RFC texts are cached because the check FAILS CLOSED without them —
      # deliberately, since "could not check" is not "fine" — and an rfc-editor.org
      # blip should not turn every PR red. Published RFCs are immutable, so the key
      # only needs to change when the script's RFC list does.
      - uses: actions/cache@v4
        with:
          path: scripts/.rfc-cache
          key: rfc-corpus-${{ hashFiles('scripts/rfc-quote-check.py') }}
          restore-keys: rfc-corpus-
      - run: python3 scripts/rfc-quote-check.py
