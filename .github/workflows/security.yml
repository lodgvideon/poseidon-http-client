name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan so a newly-disclosed advisory against an already-shipped
    # dependency is caught even with no code change.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Scan on the toolchain go.mod declares, NOT on 'stable'. 'stable' has
          # to resolve through the actions/go-versions manifest, which lags a Go
          # security release by days: on 2026-08-13 it still resolved to 1.26.5,
          # so this job red-flagged the whole repo for GO-2026-6090 and
          # GO-2026-5972 hours after both were patched, and no change here could
          # have cleared it. setup-go reads go.mod's `toolchain` directive in
          # preference to its `go` directive and falls back to go.dev/dl when an
          # exact version is missing from the manifest, so the scanned stdlib is
          # the one the repo pins and a patch bump is a one-line go.mod edit.
          # govulncheck still fails only on vulnerabilities reachable from this
          # module's call graph.
          go-version-file: 'go.mod'
          cache: true
      - name: Install govulncheck
        # Pinned, not @latest: golang.org/x/vuln@v1.8.0 (2026-09-08) raised its
        # own go.mod floor to go 1.26.0, and setup-go above pins this job to
        # go.mod's toolchain (currently 1.25.13), so @latest breaks this job
        # the moment upstream ships a release needing a newer Go than we pin -
        # independent of any change in this repo. v1.7.0 still only requires
        # go 1.25.0. Bump deliberately in step with the pinned Go version.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Scan for reachable known vulnerabilities
        run: govulncheck ./...

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: go
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"
