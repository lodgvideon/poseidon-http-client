name: nightly

# Mutation fuzzing of every binary-protocol parser in the module. Kept off the PR
# path: regular CI only replays the seed corpus via `go test`, which proves the
# parsers still handle the inputs we already thought of. Finding the inputs we did
# not think of is this job's whole purpose, and it needs minutes per target.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false # one crashing target must not cancel the others
      matrix:
        include:
          # The QUIC varint decoder underlies every packet and frame field, so it
          # sees peer bytes before anything else does. It lives in bytesx; a cell
          # here previously omitted `target` (making the step `-fuzz '^$'`, which
          # matches no target) and a second cell looked for it in bufx, which has
          # no fuzz target at all. Both exited 0 in milliseconds, so the job
          # reported green for a decoder it had never fuzzed. bufx is not listed:
          # its only peer-input parser is StripPadding, reached from all three
          # frame.dispatch* padded paths and so already covered by
          # FuzzFramerReadFrame below.
          - pkg: ./internal/bytesx
            target: FuzzReadVarint
          - pkg: ./conn
            target: FuzzConnReader
          - pkg: ./frame
            target: FuzzFramerReadFrame
          - pkg: ./hpack
            target: FuzzHPACKDecode
          - pkg: ./hpack
            target: FuzzHuffmanRoundTrip
          - pkg: ./hpack
            target: FuzzDecodeInteger
          - pkg: ./qpack
            target: FuzzDecodeFieldSection
          - pkg: ./qpack
            target: FuzzRequiredInsertCount
          - pkg: ./qpack
            target: FuzzDynamicIndexResolution
          # The two QPACK instruction streams. Both are read from unidirectional
          # streams the peer opens, so they parse unauthenticated bytes with no
          # framing above them to constrain what arrives.
          - pkg: ./qpack
            target: FuzzParseEncoderInstructions
          - pkg: ./qpack
            target: FuzzParseDecoderInstructions
          - pkg: ./http3
            target: FuzzFrameReader
          - pkg: ./http3
            target: FuzzParseSettings
          # The rest of http3's peer-facing parsers. This package and qpack are the
          # two sitting closest to unauthenticated peer bytes that the matrix
          # under-covered relative to quic and frame (#687), so they are the first
          # slice of the 19 targets whose seed corpus CI replays but which nothing
          # was mutating. Deliberately staged: the remaining 12 (client 4, grpc 3,
          # http1 3, hpack 1, quic 1) are further from peer input and wait until
          # these have run a while, because a target that finds something at 3am
          # needs someone to triage it.
          - pkg: ./http3
            target: FuzzParseFrameHeader
          - pkg: ./http3
            target: FuzzReadStreamType
          - pkg: ./http3
            target: FuzzDecodeResponseHeaders
          - pkg: ./http3
            target: FuzzDecodeTrailers
          - pkg: ./http3
            target: FuzzQPACKEncoderStreamBuffer
          - pkg: ./quic
            target: FuzzParseFrames
          - pkg: ./quic
            target: FuzzParseHeader
          # First contact with an unauthenticated peer: the most exposed code here.
          - pkg: ./quic
            target: FuzzAcceptInitial
          - pkg: ./quic
            target: FuzzParseTransportParams
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with: { go-version: '1.25' }

      # `go test -fuzz` exits 0 when its pattern matches no target -- it prints
      # "no fuzz tests to fuzz" to stdout and passes -- so a misspelled or
      # misplaced target name is indistinguishable from a clean 5-minute run in
      # the job summary. Resolve the name against the package first and fail
      # loudly when it is absent, so a cell can never again report green while
      # fuzzing nothing.
      - name: Verify ${{ matrix.target }} exists in ${{ matrix.pkg }}
        run: |
          go test -list '^${{ matrix.target }}$' ${{ matrix.pkg }} \
            | grep -qx '${{ matrix.target }}' \
            || { echo "::error::fuzz target ${{ matrix.target }} not found in ${{ matrix.pkg }}"; exit 1; }

      # -run '^$' keeps the unit tests out of the way so the whole budget goes to
      # mutation.
      - name: Fuzz ${{ matrix.target }}
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=5m ${{ matrix.pkg }}

      # A crash writes its reproducer to <pkg>/testdata/fuzz/<Target>/<hash>, so
      # match it with a recursive glob. The previous root-anchored `testdata/fuzz/`
      # matched no package, which would have dropped the reproducer for every crash
      # this job ever found — the one artifact that makes a crash actionable.
      - name: Upload crash reproducer on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: '**/testdata/fuzz/**'
          if-no-files-found: ignore
