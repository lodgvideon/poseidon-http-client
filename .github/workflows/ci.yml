name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint v2.5.0
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.5.0
      - run: go vet ./...
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go test -race -count=1 ./...
      # The allocation gates in conn and grpc are //go:build !race, because the
      # race detector allocates as it instruments and swamps a difference of one
      # allocation. Every other job here runs -race, and the two that do not
      # filter by name (-run=Fuzz, -run=Conformance), so without this step those
      # gates never execute in CI at all: `go test -race -run TestInvokeInto_
      # AllocsPerCall ./grpc/` prints "no tests to run" and passes. They are the
      # only thing standing between a per-RPC allocation and a green build, since
      # bench-gate's absolute zero-alloc rule covers neither package.
      - name: Allocation gates (not under -race)
        run: go test -count=1 -run 'Allocs|DoesNotAllocate|IsNotCopied' ./client/ ./grpc/
      # http1 is RFC 9112 and http3 is RFC 9114; neither compresses headers, and
      # both used to import hpack — RFC 7541 — for nothing but the field struct.
      # The shared vocabulary lives in ./header now, and this keeps the edge from
      # coming back.
      #
      # DIRECT imports, not `go list -deps`: http3 reaches hpack transitively
      # through qpack, whose use of the prefixed-integer codec and the Huffman
      # table is reuse QPACK specifies for itself and is meant to stay.
      - name: http1 and http3 do not import hpack
        run: |
          for pkg in ./http1 ./http3; do
            if go list -f '{{join .Imports " "}}' "$pkg" | grep -q 'poseidon-http-client/hpack'; then
              echo "$pkg imports hpack directly; the shared header vocabulary is in ./header" >&2
              exit 1
            fi
          done
      # Keep the opt-in debug build (-tags poseidondebug) compilable so the
      # leak detector can't bitrot. Compile + vet only — its finalizer/GC tests
      # have non-deterministic timing, so they run via `make test-debug`.
      - name: Compile-check debug build tag
        run: go build -tags poseidondebug ./... && go vet -tags poseidondebug ./...

  fuzz-corpus-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go test -run=Fuzz -count=1 ./...

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests with coverage profile
        # Exclude examples/ (runnable demos, no tests) — they are doc artifacts,
        # not library code, and would otherwise report 0% and trip the gate.
        run: go test -race -count=1 -coverprofile=cover.out $(go list ./... | grep -v /examples/)
      - name: Per-package + total coverage gate (floor = 80)
        run: ./scripts/coverage-gate.sh 80

  # contrib/prometheus is a nested module, so the root `./...` above never
  # reaches it. It needs its own job or it rots unnoticed.
  contrib-prometheus:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contrib/prometheus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Install golangci-lint v2.5.0
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v2.5.0
      - run: go vet ./...
      - run: golangci-lint run ./...
      # Against the released parent version pinned in go.mod — what a
      # consumer actually gets.
      - run: go test -race -count=1 ./...
      # Against this commit's parent, so a breaking change to the client's
      # Stats/Metrics/Hooks surface fails here rather than after release.
      - name: Re-test against the in-tree client
        run: |
          go mod edit -replace=github.com/lodgvideon/poseidon-http-client=../..
          go mod tidy
          go test -race -count=1 ./...
          git checkout go.mod go.sum
