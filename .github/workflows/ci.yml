name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - uses: ./.github/actions/golangci-lint
      - run: go vet ./...
      - run: golangci-lint run ./...

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - run: go test -race -count=1 ./...
      # The allocation gates in conn, client and grpc are //go:build !race,
      # because the race detector allocates as it instruments and swamps a
      # difference of one allocation. Every other job here runs -race, and the two
      # that do not filter by name (-run=Fuzz, -run=Conformance), so without this
      # step those gates never execute in CI at all: `go test -race -run
      # TestInvokeInto_AllocsPerCall ./grpc/` prints "no tests to run" and passes.
      # They are the only thing standing between a per-RPC allocation and a green
      # build, since bench-gate's absolute zero-alloc rule covers none of the three.
      #
      # This step has TWO ways to silently cover nothing, and both had bitten by
      # 2026-08-12. A !race test escapes CI entirely if EITHER its package is
      # missing from the list below OR its name misses the -run pattern.
      #
      #   1. ./conn/ was absent, so TestWriteData_DoesNotAllocate and
      #      TestWriteDataV_DoesNotAllocate never ran — the comment above named
      #      conn, the command did not.
      #   2. TestCallOptions_AreStillApplied and _EndToEndStillHonoured matched
      #      no alternative in the pattern, so they never ran either. Those two
      #      are the correctness half of the callopts gate: the tests that exist
      #      precisely so the allocation ceiling cannot pass on a helper nothing
      #      calls any more. The guard against a vacuous gate was itself vacuous.
      #
      # Both verified before fixing: each printed "[no tests to run]" and passed
      # green. When adding a !race test, check it against BOTH lists:
      #   grep -rl '//go:build !race' --include='*_test.go' .   # package present?
      #   go test -count=1 -v -run '<pattern>' ./...            # name matches?
      #
      #   3. ./http1/ was absent when TestWriteRequest_CaseFoldingDoesNotAllocate
      #      was added (#511). That one hit BOTH failure modes at once — the
      #      package was missing here AND its first name, ...CostsNoAllocations,
      #      did not match "Allocs" either. Renamed and listed.
      #   4. ./quic/ was absent for all eleven of its !race tests, and eight of
      #      the eleven missed the pattern as well — BOTH modes again, in the one
      #      package bench-gate cannot cover either: bench-gate scans Benchmark
      #      lines for B/op, and every quic benchmark that builds a Conn is
      #      env-skipped, so nothing was watching buildACK, onSent, flush or
      #      retransCopy. Found while re-deriving #508. The pattern gained Alloc
      #      (which subsumes Allocs and DoesNotAllocate), Scratch, Retrans and
      #      StaleRanges; verified by diffing the eleven !race names against the
      #      names -v actually prints, which is the check the three failures
      #      above all skipped:
      #        comm -23 <(grep -l '//go:build !race' <pkg>/*_test.go \
      #                    | xargs grep -hoE '^func Test[A-Za-z0-9_]+' \
      #                    | sed 's/^func //' | sort) \
      #                 <(go test -count=1 -v -run '<pattern>' ./<pkg>/ \
      #                    | grep -oE '^=== RUN +Test[A-Za-z0-9_]+' | awk '{print $3}' | sort -u)
      #      Empty output means every !race test in that package is reached.
      - name: Allocation gates (not under -race)
        run: go test -count=1 -run 'Alloc|IsNotCopied|CallOptions|Scratch|Retrans|StaleRanges' ./conn/ ./client/ ./grpc/ ./http1/ ./quic/
      # http1 is RFC 9112 and http3 is RFC 9114; neither compresses headers, and
      # both used to import hpack — RFC 7541 — for nothing but the field struct.
      # The shared vocabulary lives in ./header now, and this keeps the edge from
      # coming back.
      #
      # DIRECT imports, not `go list -deps`: http3 reaches hpack transitively
      # through qpack, whose use of the prefixed-integer codec and the Huffman
      # table is reuse QPACK specifies for itself and is meant to stay.
      - name: http1 and http3 do not import hpack
        run: |
          for pkg in ./http1 ./http3; do
            if go list -f '{{join .Imports " "}}' "$pkg" | grep -q 'poseidon-http-client/hpack'; then
              echo "$pkg imports hpack directly; the shared header vocabulary is in ./header" >&2
              exit 1
            fi
          done

      # The same rule one layer up. `client` is the public API and `grpc` is a
      # separate entry point; neither is an HTTP/2 codec consumer. They named
      # frame.Priority and frame.ErrCode* anyway, so an HTTP/1.1 or HTTP/3 caller
      # had to import the HTTP/2 frame package to spell a parameter type — the
      # public client.Request.Priority field among them. conn/aliases.go carries
      # the bindings now and says so in its header comment (#714).
      #
      # DIRECT imports again, for the same reason as above: `client` reaches frame
      # transitively through conn, which is the layering working, not a skip. Test
      # files are out of scope — .Imports excludes them, and a test that reaches
      # for the codec directly is testing the codec.
      - name: client and grpc do not import frame
        run: |
          for pkg in ./client ./grpc; do
            if go list -f '{{join .Imports " "}}' "$pkg" | grep -q 'poseidon-http-client/frame'; then
              echo "$pkg imports frame directly; the re-exports live in conn/aliases.go" >&2
              exit 1
            fi
          done

      # The pooling edge, and the reason ./pool exists at all. grpc must reach the
      # connection pool without linking the HTTP client: a gRPC-only binary that
      # imports client links retry, compression, HTTP/1.1 and the whole HTTP/3 +
      # QUIC stack — #915 measures 577,536 bytes for the HTTP/3 arms alone. The
      # neutral vocabulary is ./pool and the machinery is ./internal/poolcore, and
      # client keeps every moved name as an alias, so the separation cost no public
      # API. See docs/adr/0001-connection-pooling-lives-outside-client.md.
      #
      # DIRECT imports again, and test files are out of scope, for the same reasons
      # the two steps above give.
      - name: grpc does not import client
        run: |
          if go list -f '{{join .Imports " "}}' ./grpc | grep -q 'poseidon-http-client/client'; then
            echo "grpc imports client directly; the pooling vocabulary is in ./pool (docs/adr/0001)" >&2
            exit 1
          fi

      # The third cross-package invariant, and the only one that is not about
      # imports. maxInterimResponses is a PEER-INPUT bound spelled once per stack:
      # every 1xx block is decoded and handed to the caller, so a stack whose bound
      # drifts upward is the stack a hostile peer gets more work out of.
      #
      # Each package already has a TestInterimCap_MatchesSiblings tripwire, and
      # those stay — they run under a bare `go test ./...` where no CI script does,
      # and they pin the VALUE 100, which a script comparing the three to each other
      # cannot. What they cannot catch is a COORDINATED single-package edit: change
      # the constant and that package's own tripwire together and the suite is fully
      # green while the three stacks disagree. This checks all six numbers at once.
      #
      # Here rather than in conformance-gate.yml: this is not an RFC-conformance
      # question, and that workflow is pull_request-only while ci.yml also runs on
      # push (#923).
      - name: The three stacks agree on maxInterimResponses
        run: python3 scripts/interim-cap-gate.py

      # Keep the opt-in debug build (-tags poseidondebug) compilable so the
      # leak detector can't bitrot. Compile + vet only — its finalizer/GC tests
      # have non-deterministic timing, so they run via `make test-debug`.
      - name: Compile-check debug build tag
        run: go build -tags poseidondebug ./... && go vet -tags poseidondebug ./...

  # The QUIC handshake rides on crypto/tls's QUICConn, whose handshake goroutine
  # changed shape in Go 1.26: 1.25 wires its escape hatch to the context passed to
  # QUICConn.Start (`c.quic.cancelc = handshakeCtx.Done()`), 1.26 does an
  # unconditional `c.quic.blockedc <- struct{}{}` that only QUICConn.Close drains.
  # A teardown path that forgets hs.Close therefore leaks a goroutine on 1.26 and
  # is invisible on 1.25 — #683 was exactly that, and the `test` job above could
  # not have caught it at any effort. This job is the second pair of eyes.
  #
  # Scoped to quic and http3 on purpose: this is about one stdlib surface, not
  # about being an early-adopter gate for the whole module.
  quic-next-toolchain:
    runs-on: ubuntu-24.04
    # go.mod pins `toolchain go1.25.13` (#640, two stdlib CVEs) and that pin
    # stays. But the directive would make the 1.26 installed below switch BACK to
    # 1.25.13, and this job would then silently re-run what `test` already ran —
    # green, and covering nothing, which is the failure mode the `test` job's own
    # comment above documents twice. GOTOOLCHAIN=local forbids the switch, and
    # the assertion step fails the job if the switch happened anyway.
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
      - name: Assert this job really runs Go 1.26
        run: |
          v=$(go env GOVERSION)
          case "$v" in
            go1.26*) echo "running $v" ;;
            *) echo "expected go1.26.x, got $v: GOTOOLCHAIN=local is not holding and go.mod's toolchain directive won, so this job covers nothing" >&2; exit 1 ;;
          esac
      - run: go test -race -count=1 ./quic/ ./http3/

  fuzz-corpus-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - run: go test -run=Fuzz -count=1 ./...

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - name: Run tests with coverage profile
        # Exclude examples/ (runnable demos, no tests) — they are doc artifacts,
        # not library code, and would otherwise report 0% and trip the gate.
        run: go test -race -count=1 -coverprofile=cover.out $(go list ./... | grep -v /examples/)
      - name: Per-package + total coverage gate (floor = 80)
        run: ./scripts/coverage-gate.sh 80

  # contrib/prometheus is a nested module, so the root `./...` above never
  # reaches it. It needs its own job or it rots unnoticed.
  contrib-prometheus:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: contrib/prometheus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true
      - uses: ./.github/actions/golangci-lint
      - run: go vet ./...
      - run: golangci-lint run ./...
      # Against the released parent version pinned in go.mod — what a
      # consumer actually gets.
      - run: go test -race -count=1 ./...
      # Against this commit's parent, so a breaking change to the client's
      # Stats/Metrics/Hooks surface fails here rather than after release.
      - name: Re-test against the in-tree client
        run: |
          go mod edit -replace=github.com/lodgvideon/poseidon-http-client=../..
          go mod tidy
          go test -race -count=1 ./...
          git checkout go.mod go.sum
