name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker-it:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Undertow image
        uses: docker/build-push-action@v7
        with:
          context: test/integration
          file: test/integration/Dockerfile.undertow
          tags: poseidon-it/undertow:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Generate test certs
        run: cd test/integration && ./scripts/gen-certs.sh

      - name: docker compose up
        run: docker compose -f test/integration/docker-compose.yml up -d --wait

      - name: Integration tests
        run: |
          go test -tags=integration -race -count=1 \
            -timeout=300s -v ./client/integration_test/...

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f test/integration/docker-compose.yml logs
        continue-on-error: true

      - name: docker compose down
        if: always()
        run: docker compose -f test/integration/docker-compose.yml down -v

  # HTTP/3 interop matrix: the from-scratch client against two real, independent
  # HTTP/3 server stacks (Caddy/quic-go and nginx/C) over real UDP. Container-to-
  # container UDP works on Linux CI (the host-UDP-forwarding limitation is Docker
  # Desktop on Windows only); the runner's exit code gates the job.
  h3-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # `run` (not `up --abort-on-container-exit`) so the one-shot init services
      # (fixtures, certs) exiting cannot tear the stack down before the runner
      # executes — `run` starts the dependency graph, runs only the runner, and
      # returns its exit code.
      - name: HTTP/3 interop matrix (Caddy + nginx + aioquic)
        run: |
          docker compose -f test/integration/http3/docker-compose.yml \
            run --rm runner

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f test/integration/http3/docker-compose.yml logs
        continue-on-error: true

      - name: docker compose down
        if: always()
        run: docker compose -f test/integration/http3/docker-compose.yml down -v

  # HTTP/3 recovery under network faults: the client dials Caddy through a UDP
  # relay that drops (loss recovery, RFC 9002) or reorders (ack-range handling +
  # receive reassembly) datagrams. Levels are kept conservative for CI
  # reliability; the seed is fixed so a failure is reproducible.
  h3-interop-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      LOSS_COMPOSE: test/integration/http3/docker-compose.loss.yml
    steps:
      - uses: actions/checkout@v7

      - name: Loss recovery (15%)
        env:
          LOSS_PCT: "15"
        run: docker compose -f "$LOSS_COMPOSE" run --rm runner
      - name: Logs on failure (loss)
        if: failure()
        run: docker compose -f "$LOSS_COMPOSE" logs
        continue-on-error: true
      - name: down (loss)
        if: always()
        run: docker compose -f "$LOSS_COMPOSE" down -v

      - name: Reordering (20%)
        env:
          LOSS_PCT: "0"
          REORDER_PCT: "20"
        run: docker compose -f "$LOSS_COMPOSE" run --rm runner
      - name: Logs on failure (reorder)
        if: failure()
        run: docker compose -f "$LOSS_COMPOSE" logs
        continue-on-error: true
      - name: down (reorder)
        if: always()
        run: docker compose -f "$LOSS_COMPOSE" down -v

  # HTTP/3 negative-path interop: the client against a deliberately misbehaving
  # quic-go server (test/integration/http3/faultserver) — the reset fault checks
  # a retryable StreamResetError is surfaced (RFC 9114 §4.1.1). The server
  # compiles before it listens; the runner retries the dial.
  h3-interop-fault:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAULT_COMPOSE: test/integration/http3/docker-compose.fault.yml
    steps:
      - uses: actions/checkout@v7

      - name: HTTP/3 negative paths (fault server)
        run: docker compose -f "$FAULT_COMPOSE" run --rm runner
      - name: Logs on failure
        if: failure()
        run: docker compose -f "$FAULT_COMPOSE" logs
        continue-on-error: true
      - name: down
        if: always()
        run: docker compose -f "$FAULT_COMPOSE" down -v
