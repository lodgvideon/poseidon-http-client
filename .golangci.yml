version: "2"

run:
  timeout: 5m
  # Without these, golangci-lint type-checks nothing behind a custom build tag:
  # it reports "build constraints exclude all Go files" and then prints
  # "0 issues." — clean-looking output for a package it never read. That hid a
  # deprecated h2c.NewHandler in the integration harness through a lint job that
  # was green and always would have been.
  build-tags:
    - integration
    - interop
    - poseidondebug

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - unconvert
    - misspell
    - gocyclo
    - unused
    - prealloc
    - ineffassign
    # errorlint: a sentinel compared with == (or a bare type assertion) silently
    # stops matching the moment that error is wrapped with %w. Every production
    # comparison uses errors.Is/As; this keeps it that way. Tests keep the direct
    # == form (they construct the sentinel they compare against), so it is
    # excluded below alongside errcheck/gosec.
    - errorlint
    # ── Ratchets ──────────────────────────────────────────────────────
    # Everything below reported zero findings across the tree (root module
    # and contrib/, all three build tags) when it was added. None of them is
    # here to clean up a backlog; each one pins a property the code already
    # has so a regression fails review instead of shipping.
    #
    # depguard: the headline claim of this module is that the HTTP/1.1,
    # HTTP/2, HPACK, QUIC, HTTP/3 and QPACK stacks are implemented from the
    # RFCs rather than wrapped around an existing one. Until now that claim
    # lived only in prose. Production code imports none of the denied
    # packages today; test code still may, because the reference peers
    # (net/http, x/net/http2, quic-go) are exactly what the conformance and
    # interop suites need to test against.
    - depguard
    # durationcheck: multiplying two time.Durations yields a nonsense unit.
    # The loss-recovery and pacing code (RFC 9002) does more Duration
    # arithmetic than the rest of the tree combined — PTO backoff, RTT
    # smoothing, the pacer's inter-packet gap — and the result is a timer,
    # so a unit error shows up as a mysterious stall, not a compile error.
    - nilnesserr
    - durationcheck
    # gocheckcompilerdirectives: a misspelled //go:noinline or //go:norace is
    # a plain comment. In a tree where the alloc benchmarks and the bench-gate
    # depend on inlining decisions, a directive that silently does nothing is
    # a benchmark that silently measures something else.
    - gocheckcompilerdirectives
    # mirror: []byte/string conversions that the bytes/strings mirror API
    # avoids. Each one is an allocation on paths the bench-gate holds at zero.
    - mirror
    # bodyclose: the conformance and integration suites drive real net/http
    # clients against httptest servers; an unclosed body leaks a connection
    # into whatever test runs next.
    - bodyclose
    # usetesting: t.Context()/t.Setenv over the hand-rolled equivalents.
    - usetesting
    - asasalint
    - reassign
    - exptostd
    # bidichk: bidirectional-override runes can make a diff read differently
    # than it compiles. Cheap insurance for a module other people vendor.
    - bidichk
  settings:
    depguard:
      rules:
        from-scratch:
          # Test files are exempt: the reference implementations are the
          # peers the conformance suites are written against.
          files:
            - "!$test"
          deny:
            - pkg: net/http
              desc: "client/, conn/ and http1/ implement HTTP themselves; net/http belongs to the test peers only"
            - pkg: golang.org/x/net/http2
              desc: "frame/, hpack/ and conn/ are the HTTP/2 implementation; x/net/http2 is a test peer only"
            - pkg: github.com/quic-go/quic-go
              desc: "quic/ implements RFC 9000/9001/9002 itself; quic-go belongs to the interop harness only"
    gocyclo:
      min-complexity: 25
    gosec:
      excludes:
        # G115: integer overflow conversions (int<->uintXX) are pervasive
        # in binary-protocol codec paths and bounded by test coverage; the
        # heuristic produces high false-positive noise.
        - G115
        # G402: TLS MinVersion. Tests use default TLS config against
        # httptest servers; production callers of TLSDialer supply their
        # own *tls.Config. The default Go TLS floor is acceptable.
        - G402
        # G404: weak RNG. The retry layer uses math/rand for backoff
        # jitter — the goal is anti-thundering-herd desynchronization, not
        # cryptographic unpredictability. crypto/rand would be overkill and
        # add allocation cost on the retry path.
        - G404
    govet:
      enable-all: true
      disable:
        # fieldalignment: measured, not assumed. It reports 81 production
        # structs; repacking every one of them saves 442 bytes in total, and
        # the two largest wins land on structs that are pooled (conn.Stream,
        # 24 B) or per-connection (quic.Conn, 104 B) — neither shows up in the
        # per-request allocation the bench-gate holds at zero. Against that,
        # field order here carries information: wmu sits next to what it
        # serializes, psMu next to peerSettings, and sorting by width deletes
        # that. Run it as a one-shot audit if a specific struct ever matters.
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: unused-parameter
          disabled: true
        - name: exported
          arguments:
            - disableStutteringCheck
            - disableChecksOnConstants
  exclusions:
    rules:
      # errcheck + gosec: tolerate ignored errors in *_test.go where the
      # test body asserts behavior via other means; G104 false-positives
      # (e.g. w.Write in handler funcs, gzip.Writer.Close in setup code).
      - path: _test\.go$
        linters: [errcheck, gosec, errorlint]

# golangci-lint v2 moved formatters out of `linters` into their own section,
# and this file did not have one — so nothing checked gofmt, here or in CI.
# 32 files had drifted, 8 of them production (misaligned struct-field
# comments, trailing blank lines, over-long one-line method bodies).
# `golangci-lint run` reports these; `golangci-lint fmt` fixes them.
#
# This only holds if the tree is LF: gofmt emits LF unconditionally, so a
# CRLF checkout makes every file report as unformatted. See .gitattributes.
formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
