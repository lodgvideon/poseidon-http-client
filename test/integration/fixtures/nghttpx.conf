# nghttpx frontend config — poseidon integration test
#
# nghttpx is a PROXY, not an origin: it has no fixtures of its own, so it needs
# a backend that serves them. That backend is the Undertow container, which
# already answers the whole fixture set (/healthz, /, /echo, /large, /status,
# /delay, /chunked, /gzip, /trailers, /never) over cleartext HTTP/2 on :8080.
#
# What that means for a failure here: this peer exercises poseidon's client
# against nghttpx's HTTP/2 *frontend*, which is the point of adding it. The
# response bodies come from Undertow, so a body-level disagreement is more
# likely Undertow's than nghttpx's — check the undertow peer's own subtest
# before blaming nghttpx. A framing, flow-control or HPACK disagreement is
# nghttpx's, because that is the half nghttpx re-encodes.
#
# This config previously pointed at 127.0.0.1,9001 with a comment promising a
# Go backend inside the container. No such backend was ever built into the
# image, so nothing could have run against it.

# h2 over TLS on 8443 (host 18083), h2c on 8080 (host 18084) — the two ports
# CONTRACT.md assigns. tls is per-frontend, so the second one is cleartext.
frontend=0.0.0.0,8443
frontend=0.0.0.0,8080;no-tls

private-key-file=/etc/nghttpx/certs/server.key
certificate-file=/etc/nghttpx/certs/server.pem

# Cleartext HTTP/2 to the backend: Undertow's :8080 listener speaks h2c, and
# keeping the hop plaintext means a backend TLS failure cannot masquerade as a
# frontend one.
backend=undertow,8080;;proto=h2

# Boolean options need an explicit "=yes" in a config file, unlike the bare
# --no-ocsp command-line flag. Written bare here, nghttpx rejects the whole file
# with "Bad configuration format" and exits — which is what it did the first
# time this config was ever loaded.
no-ocsp=yes
http2-max-concurrent-streams=128
log-level=INFO
