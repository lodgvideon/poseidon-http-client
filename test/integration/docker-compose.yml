name: poseidon-it

networks:
  h2net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

services:
  # ── nginx — production C-impl, h2 over TLS ──────────────────────
  nginx:
    image: openresty/openresty:1.27.1.1-alpine-fat
    container_name: poseidon-it-nginx
    hostname: nginx
    networks:
      h2net:
        ipv4_address: 172.30.0.10
    ports:
      - "127.0.0.1:18080:8443"
    volumes:
      - ./fixtures/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./fixtures/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 3s
    restart: "no"

  # ── Undertow — JVM h2 server, h2 + h2c ──────────────────────────
  undertow:
    build:
      context: .
      dockerfile: Dockerfile.undertow
    image: poseidon-it/undertow:local
    container_name: poseidon-it-undertow
    hostname: undertow
    networks:
      h2net:
        ipv4_address: 172.30.0.11
    ports:
      - "127.0.0.1:18081:8443"
      - "127.0.0.1:18082:8080"
    volumes:
      - ./fixtures/certs:/app/certs:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 15s
    environment:
      - JAVA_OPTS=-XX:+UseG1GC -Xmx512m
    restart: "no"

  # ── nghttpx — nghttp2's proxy, h2 + h2c ─────────────────────────
  #
  # A third conforming peer, and the only one whose HTTP/2 comes from the
  # nghttp2 library — the same implementation curl and h2load use, so it is the
  # closest thing here to a reference encoder.
  #
  # It is a proxy, so it has no fixtures: it forwards to Undertow's h2c
  # listener, which already serves the whole set. See fixtures/nghttpx.conf for
  # what that means when a test fails.
  nghttpx:
    build:
      context: .
      dockerfile: Dockerfile.nghttp2
    image: poseidon-it/nghttpx:local
    container_name: poseidon-it-nghttpx
    hostname: nghttp2
    networks:
      h2net:
        ipv4_address: 172.30.0.12
    ports:
      - "127.0.0.1:18083:8443"
      - "127.0.0.1:18084:8080"
    volumes:
      - ./fixtures/certs:/etc/nghttpx/certs:ro
      - ./fixtures/nghttpx.conf:/etc/nghttpx/nghttpx.conf:ro
    command: ["--conf=/etc/nghttpx/nghttpx.conf"]
    # Undertow is this peer's origin, so nghttpx is useless until it answers.
    # Waiting on health rather than start avoids a window where nghttpx accepts
    # a connection and 503s, which reads as a poseidon failure.
    depends_on:
      undertow:
        condition: service_healthy
    # Probes the h2c frontend, which proves both hops: nghttpx is listening AND
    # its backend answers. A frontend-only check would pass while every request
    # 503s.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 3s
    restart: "no"

  # ── Toxiproxy — fault injection in front of the peers above ─────
  #
  # Transparent TCP proxy with a runtime HTTP API, so toxics are applied per
  # test rather than globally for the compose run (#552). It terminates TCP,
  # not TLS: bytes pass through untouched, so h2-over-TLS works and the
  # existing suite's tls.Config needs no change.
  #
  # Deliberately NOT given a proxy definition here. Proxies are created over
  # the API by the test that needs one and removed afterwards, so a leftover
  # toxic cannot leak into an unrelated test.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: poseidon-it-toxiproxy
    hostname: toxiproxy
    networks:
      h2net:
        ipv4_address: 172.30.0.13
    # 18474 is the control API; 18085 is the listen port every test in
    # client/integration_test/toxiproxy_test.go binds its proxy to, upstream
    # nginx TLS. 18086 was published alongside it from the first commit and
    # bound by nothing, ever — a published port with no listener behind it reads
    # as coverage that exists, so it is gone rather than reserved. Publishing
    # another is one line if a second upstream is ever wanted.
    ports:
      - "127.0.0.1:18474:8474"
      - "127.0.0.1:18085:18085"
    command: ["-host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 1s
    restart: "no"
