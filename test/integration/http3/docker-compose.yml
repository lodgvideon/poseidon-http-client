name: poseidon-h3-it

# HTTP/3 interop: a real Caddy HTTP/3 server and an in-container test runner on a
# shared bridge network. The runner runs the client in a container (not on the
# host) because Docker Desktop on Windows does not forward host UDP to a
# published container port — container-to-container UDP works everywhere.

networks:
  h3net:
    driver: bridge

services:
  # Generate the 1 MiB throughput fixture (/srv/huge.txt) as an exact repeat of
  # the 16-byte pattern the HugeResponse test checks — no newlines, so it matches
  # strings.Repeat("0123456789abcdef", 65536) byte-for-byte. Kept out of git (see
  # .gitignore) so the 1 MiB blob is not committed.
  fixtures:
    image: busybox
    volumes:
      - ./srv:/srv
    command:
      - sh
      - -c
      - |
        printf '0123456789abcdef%.0s' $$(seq 1024) > /tmp/b
        : > /srv/huge.txt
        i=0; while [ $$i -lt 64 ]; do cat /tmp/b >> /srv/huge.txt; i=$$((i+1)); done
    restart: "no"

  caddy:
    image: caddy:2
    hostname: h3caddy
    networks: [h3net]
    depends_on:
      fixtures:
        condition: service_completed_successfully
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./srv:/srv:ro
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://localhost/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  runner:
    image: golang:1.24
    depends_on:
      caddy:
        condition: service_healthy
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      H3_INTEROP_ADDR: h3caddy:443
      GOFLAGS: -count=1
    command: >
      go test ./http3/ -tags interop -run TestInterop -v -timeout 90s
    restart: "no"
