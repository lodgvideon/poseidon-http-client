name: poseidon-h3-it

# HTTP/3 interop MATRIX: the from-scratch client is exercised against three real,
# independent HTTP/3 server stacks on a shared bridge network — Caddy (quic-go,
# Go), nginx (its own C QUIC implementation), and aioquic (pure Python, QPACK via
# ls-qpack) — so cross-implementation interop bugs (QPACK, flow control,
# connection-ID rotation, key-update timing) surface, not just quic-go's
# behaviour. The runner runs the client in a container (not on the host) because
# Docker Desktop on Windows does not forward host UDP to a published container
# port; container-to-container UDP works everywhere.

networks:
  h3net:
    driver: bridge

volumes:
  certs:

services:
  # Generate the 1 MiB throughput fixture (/srv/huge.txt) as an exact repeat of
  # the 16-byte pattern the HugeResponse test checks — no newlines, so it matches
  # strings.Repeat("0123456789abcdef", 65536) byte-for-byte. Kept out of git (see
  # .gitignore) so the 1 MiB blob is not committed.
  fixtures:
    image: busybox
    volumes:
      - ./srv:/srv
    command:
      - sh
      - -c
      - |
        printf '0123456789abcdef%.0s' $$(seq 1024) > /tmp/b
        : > /srv/huge.txt
        i=0; while [ $$i -lt 64 ]; do cat /tmp/b >> /srv/huge.txt; i=$$((i+1)); done
    restart: "no"

  # Self-signed cert for nginx (Caddy issues its own internal cert). The client
  # skips verification, so a bare self-signed cert is sufficient.
  certs:
    image: alpine/openssl
    volumes:
      - certs:/certs
    command: >
      req -x509 -newkey rsa:2048 -nodes -days 3650
      -keyout /certs/key.pem -out /certs/cert.pem -subj "/CN=h3nginx"
    restart: "no"

  # ── Caddy — quic-go (Go) HTTP/3 ─────────────────────────────────
  # Digest-pinned so the interop matrix does not drift when the caddy:2 /
  # nginx:1.27 tags are re-published (a silent server upgrade could mask or
  # introduce a client interop regression). Refresh with:
  #   docker buildx imagetools inspect caddy:2   (resolved 2026-07-14)
  # Upload target that consumes the request body and echoes the byte count it
  # received (X-Sink-Received). Caddy and nginx are fronted onto it for /sink,
  # because neither reads a body it has no use for: Caddy's canned `respond` and
  # nginx's `return` both answer on the request headers, which made the
  # congestion-control benchmark time a round trip instead of the transfer
  # (#564). aioquic needs no proxy — it waits for stream_ended by construction.
  sink:
    image: golang:1.25
    hostname: sink
    networks: [h3net]
    working_dir: /src/test/integration/http3/sink
    volumes:
      - ../../..:/src
    command: go run .
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s
    restart: "no"

  caddy:
    image: caddy:2@sha256:af5fdcd76f2db5e4e974ee92f96ee8c0fc3edb55bd4ba5032547cbf3f65e486d
    hostname: h3caddy
    networks: [h3net]
    depends_on:
      fixtures:
        condition: service_completed_successfully
      sink:
        condition: service_healthy
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./srv:/srv:ro
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://localhost/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  # ── nginx — its own C QUIC HTTP/3 stack ─────────────────────────
  # The nginx image ships no curl/wget for a healthcheck, so it is gated on
  # service_started; the runner retries the dial until nginx is serving.
  nginx:
    image: nginx:1.27@sha256:6784fb0834aa7dbbe12e3d7471e69c290df3e6ba810dc38b34ae33d3c1c05f7d
    hostname: h3nginx
    networks: [h3net]
    depends_on:
      fixtures:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
      sink:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./srv:/srv:ro
      - certs:/certs:ro
    restart: "no"

  # ── aioquic — a third independent QUIC/H3 stack (pure Python) ────
  # Its value is transport-layer diversity: aioquic's own ACK strategy, MAX_STREAMS
  # replenishment, flow-control cadence, and handshake shape, distinct from quic-go
  # (Caddy) and nginx's C stack. (QPACK is ls-qpack, a third encoder, but static-
  # only against the capacity-0 client — small extra decode coverage.) It pip-
  # installs aioquic at startup (prebuilt wheels, a few seconds), then serve() binds
  # the socket and the server touches /tmp/ready; the healthcheck polls that file so
  # the runner (gated on service_healthy) waits out startup without a raised dial
  # timeout, and a PyPI hiccup fails the healthcheck rather than burning test time.
  aioquic:
    image: python:3.12-slim
    hostname: h3aioquic
    networks: [h3net]
    depends_on:
      fixtures:
        condition: service_completed_successfully
      certs:
        condition: service_completed_successfully
    volumes:
      - ./aioquic/server.py:/app/server.py:ro
      - ./srv:/srv:ro
      - certs:/certs:ro
    command:
      - sh
      - -c
      - pip install --quiet --no-cache-dir 'aioquic==1.2.0' && exec python /app/server.py
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 3s
    restart: "no"

  runner:
    image: golang:1.25
    depends_on:
      caddy:
        condition: service_healthy
      nginx:
        condition: service_started
      aioquic:
        condition: service_healthy
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      # name=host:port pairs — the interop tests run every scenario against each.
      H3_INTEROP_ADDRS: "caddy=h3caddy:443,nginx=h3nginx:443,aioquic=h3aioquic:443"
      # All three peers now drain this path, so the goodput benchmark measures a
      # real transfer against each of them rather than being skipped (#564).
      H3_CC_PATH: "/sink"
      # Small: the interop matrix is about correctness across peers, and the CC
      # harness (docker-compose.cc.yml) is where the sizes are turned up.
      H3_CC_BYTES: "262144"
      H3_CC_REPEATS: "1"
      GOFLAGS: -count=1
    command: >
      go test ./http3/ ./client/ -tags interop -run TestInterop -v -timeout 120s
    restart: "no"
