name: poseidon-h3-cc

# Congestion-control A/B (#362): the same upload run through lossproxy twice,
# once per controller, over a loss/RTT matrix.
#
# The measured transfer is an UPLOAD on purpose. Congestion control governs the
# sender, so a download would measure Caddy's controller (quic-go's) and say
# nothing about quic/bbr.go.
#
# Drive it with scripts/cc-matrix.sh rather than by hand — the point is the
# comparison, and a single cell in isolation is not one.

networks:
  h3net:
    driver: bridge

services:
  # Upload target that consumes the body. See sink/main.go and #564: the
  # benchmark previously posted to a canned `respond` route that never read the
  # request, so it timed a header round trip instead of the transfer.
  sink:
    image: golang:1.25
    hostname: sink
    networks: [h3net]
    working_dir: /src/test/integration/http3/sink
    volumes:
      - ../../..:/src
    command: go run .
    healthcheck:
      # The golang image is Debian-based, so bash's /dev/tcp is available and no
      # extra tooling has to be installed just to answer "is it listening yet".
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 1s
      timeout: 2s
      retries: 60
      start_period: 3s
    restart: "no"

  caddy:
    image: caddy:2
    hostname: h3caddy
    depends_on:
      # Without this the sink never starts — nothing else references it — and
      # every upload comes back 502 from reverse_proxy.
      sink:
        condition: service_healthy
    networks: [h3net]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./srv:/srv:ro
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://localhost/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  lossproxy:
    image: golang:1.25
    hostname: lossproxy
    depends_on:
      caddy:
        condition: service_healthy
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      UPSTREAM: h3caddy:443
      LOSS_PCT: "${LOSS_PCT:-0}"
      REORDER_PCT: "${REORDER_PCT:-0}"
      # One-way delay; the round trip grows by twice this.
      DELAY_MS: "${DELAY_MS:-0}"
      SEED: "${SEED:-1}"
      # Bandwidth bottleneck. Empty means unshaped, which is the old behaviour.
      #
      # This is `tc tbf` in the kernel, NOT the hand-written token bucket that
      # was removed for not binding (scripts/cc-matrix.sh:31). It is applied
      # here, on the relay, because a bufferbloat scenario needs the queue at an
      # INTERMEDIATE hop — shaping the sender's own NIC instead would let its
      # pacer see the limit directly and no standing queue would form.
      #
      # Nothing may be concluded from a shaped run until scripts/cc-ratio-check.sh
      # passes: halving RATE must double completion time.
      RATE: "${RATE:-}"
      # Queue depth at the bottleneck, as tbf latency. This is the axis the
      # bufferbloat case actually turns on, so it is a knob rather than a
      # constant.
      QUEUE: "${QUEUE:-500ms}"
    cap_add:
      - NET_ADMIN
    command:
      - sh
      - -c
      - |
        if [ -n "$${RATE}" ]; then
          apt-get update -qq >/dev/null 2>&1
          apt-get install -y -qq iproute2 >/dev/null 2>&1
          command -v tc >/dev/null || { echo "SHAPER: tc missing, REFUSING to run unshaped"; exit 1; }
          tc qdisc add dev eth0 root tbf rate "$${RATE}" burst 32kbit latency "$${QUEUE}" || {
            echo "SHAPER: tc failed, REFUSING to run unshaped"; exit 1; }
          # Print what actually got installed. A run that silently went unshaped
          # is the exact artefact this whole exercise exists to avoid, so the
          # qdisc is evidence in the log rather than an assumption.
          echo "SHAPER: $$(tc qdisc show dev eth0 | head -1)"
        else
          echo "SHAPER: none (RATE unset)"
        fi
        exec go run test/integration/http3/lossproxy.go
    restart: "no"

  runner:
    image: golang:1.25
    depends_on:
      lossproxy:
        condition: service_started
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      H3_INTEROP_ADDR: lossproxy:443
      H3_INTEROP_CC: "${H3_INTEROP_CC:-newreno}"
      H3_CC_BYTES: "${H3_CC_BYTES:-4194304}"
      H3_CC_REPEATS: "${H3_CC_REPEATS:-3}"
      # The draining endpoint. Without it the benchmark skips rather than
      # measuring a header round trip against a peer that answers early.
      H3_CC_PATH: "${H3_CC_PATH:-/sink}"
      GOFLAGS: -count=1
    command: >
      go test ./http3/ -tags interop
      -run TestInterop_CCGoodput -v -timeout 20m
    restart: "no"
