# nginx HTTP/3 server that negotiates ONLY TLS_CHACHA20_POLY1305_SHA256, so the
# from-scratch client's ChaCha20-Poly1305 packet protection (RFC 9001 §5.3 AEAD,
# §5.4.4 header protection) is exercised on the wire. Identical to nginx.conf
# except for the ssl_conf_command that pins the TLS 1.3 cipher suite to ChaCha20;
# the client skips certificate verification, so the self-signed cert generated by
# the compose `certs` service is sufficient.

worker_processes  auto;
events {
    worker_connections  1024;
}

http {
    default_type  text/plain;

    server {
        # HTTP/3 over UDP 443, plus TLS/TCP 443 for the same names.
        listen 443 quic reuseport;
        listen 443 ssl;
        http3 on;

        server_name  h3nginxchacha localhost;

        ssl_certificate      /certs/cert.pem;
        ssl_certificate_key  /certs/key.pem;
        ssl_protocols        TLSv1.3;

        # Restrict the TLS 1.3 cipher suites (OpenSSL SSL_CONF "Ciphersuites") to
        # ChaCha20-Poly1305, so the handshake MUST select it — the client cannot
        # fall back to an AES-GCM suite.
        ssl_conf_command Ciphersuites TLS_CHACHA20_POLY1305_SHA256;

        root /srv;

        # Fixed status codes for the status-pass-through test (A3).
        location = /status/204 { return 204; }
        location = /status/304 { return 304; }
        location = /status/404 { return 404 "not found\n"; }
        location = /status/500 { return 500 "boom\n"; }

        # "/" gets a small canned response; the ChaCha interop test asserts the
        # 200 status and the negotiated cipher suite, not the body.
        location = / {
            return 200 "hello from http3 nginx (chacha20)\n";
        }
        # Everything else is served from /srv (e.g. /big.txt, /huge.txt).
        location / {
            try_files $uri =404;
        }
    }
}
