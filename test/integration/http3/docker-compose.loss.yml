name: poseidon-h3-it-loss

# HTTP/3 interop UNDER PACKET LOSS: the client dials through a UDP relay that
# drops ~10% of datagrams each way, so the GET/POST/large-body tests pass only
# if QUIC loss detection + retransmission + the probe timeout actually recover.

networks:
  h3net:
    driver: bridge

services:
  caddy:
    image: caddy:2
    hostname: h3caddy
    networks: [h3net]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./srv:/srv:ro
    healthcheck:
      test: ["CMD", "curl", "-kfsS", "-o", "/dev/null", "https://localhost/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  lossproxy:
    image: golang:1.25
    hostname: lossproxy
    depends_on:
      caddy:
        condition: service_healthy
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      UPSTREAM: h3caddy:443
      LOSS_PCT: "${LOSS_PCT:-10}"
      REORDER_PCT: "${REORDER_PCT:-0}"
      SEED: "${SEED:-1}"
    command: go run test/integration/http3/lossproxy.go
    restart: "no"

  runner:
    image: golang:1.25
    depends_on:
      lossproxy:
        condition: service_started
    networks: [h3net]
    working_dir: /src
    volumes:
      - ../../..:/src
    environment:
      H3_INTEROP_ADDR: lossproxy:443
      GOFLAGS: -count=1
    # Exclude HugeResponse: it is a clean-path throughput test (batch drain), not
    # a loss-recovery test — 1 MiB through 10% loss would only add flakiness.
    command: >
      go test ./http3/ -tags interop
      -run 'TestInterop_GET|TestInterop_POST|TestInterop_LargeResponse' -v -timeout 120s
    restart: "no"
