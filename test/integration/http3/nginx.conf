# nginx HTTP/3 server for the interop matrix — a C QUIC stack independent of
# quic-go (Caddy), so cross-implementation interop bugs surface. Serves the same
# /srv fixtures as Caddy: "/" a small canned 200, /big.txt and /huge.txt as
# static files. The client skips certificate verification, so the self-signed
# cert generated by the compose `certs` service is sufficient.

worker_processes  auto;
events {
    worker_connections  1024;
}

http {
    default_type  text/plain;

    server {
        # HTTP/3 over UDP 443, plus TLS/TCP 443 for the same names.
        listen 443 quic reuseport;
        listen 443 ssl;
        http3 on;

        server_name  h3nginx localhost;

        ssl_certificate      /certs/cert.pem;
        ssl_certificate_key  /certs/key.pem;
        ssl_protocols        TLSv1.3;

        root /srv;

        # Fixed status codes for the status-pass-through test (A3).
        location = /status/204 { return 204; }
        location = /status/304 { return 304; }
        location = /status/404 { return 404 "not found\n"; }
        location = /status/500 { return 500 "boom\n"; }

        # "/" (and a POST to it) get a small canned response; the interop GET/POST
        # tests assert only the 200 status here, not the body.
        location = / {
            return 200 "hello from http3 nginx\n";
        }
        # Everything else is served from /srv (e.g. /big.txt, /huge.txt), which the
        # large- and huge-response tests match byte-for-byte.
        location / {
            try_files $uri =404;
        }
    }
}
